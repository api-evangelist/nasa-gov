openapi: 3.2.0
info:
  title: NASA Mars Rover Photos Rovers API
  description: 'Image data gathered by NASA''s Curiosity, Opportunity, Spirit, and Perseverance rovers on Mars. Each photo

    can be queried by Earth date or Martian sol with optional camera filter.

    '
  version: '1.0'
  contact:
    name: NASA Open APIs
    url: https://api.nasa.gov/
  license:
    name: US Government Work (Public Domain)
servers:
- url: https://api.nasa.gov/mars-photos/api/v1
security:
- ApiKeyAuth: []
tags:
- name: Rovers
paths:
  /rovers:
    get:
      summary: List Mars Rovers
      operationId: listRovers
      tags:
      - Rovers
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      responses:
        '200':
          description: List of rovers and their mission manifests.
components:
  parameters:
    ApiKey:
      name: api_key
      in: query
      required: true
      schema:
        type: string
        default: DEMO_KEY
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: api_key
