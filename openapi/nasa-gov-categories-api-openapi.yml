openapi: 3.2.0
info:
  title: NASA EONET (Earth Observatory Natural Event Tracker) Categories API
  description: 'Curated source of natural events occurring on Earth - wildfires, severe storms, volcanoes, sea/lake ice,

    drought, dust/haze, earthquakes, floods, landslides, manmade, snow, temperature extremes, and water color.

    '
  version: '3.0'
  contact:
    name: NASA Earth Observatory
    url: https://eonet.gsfc.nasa.gov/docs/v3
  license:
    name: US Government Work (Public Domain)
servers:
- url: https://eonet.gsfc.nasa.gov/api/v3
tags:
- name: Categories
paths:
  /categories:
    get:
      summary: Get Event Categories
      operationId: getCategories
      tags:
      - Categories
      responses:
        '200':
          description: List of EONET event categories.
  /categories/{category}:
    get:
      summary: Get Events for a Category
      operationId: getEventsByCategory
      tags:
      - Categories
      parameters:
      - name: category
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Events in the specified category.
