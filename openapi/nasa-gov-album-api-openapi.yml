openapi: 3.2.0
info:
  title: NASA Image and Video Library Album API
  description: 'API for the NASA Image and Video Library at images.nasa.gov. Supports searching the library, retrieving

    asset manifests, metadata, captions, and resolving rich-text URLs.

    '
  version: '1.0'
  contact:
    name: NASA Image and Video Library
    url: https://images.nasa.gov/docs/images.nasa.gov_api_docs.pdf
  license:
    name: US Government Work (Public Domain)
servers:
- url: https://images-api.nasa.gov
tags:
- name: Album
paths:
  /album/{album_name}:
    get:
      summary: Get Album Manifest
      operationId: getAlbum
      tags:
      - Album
      parameters:
      - name: album_name
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Album contents.
