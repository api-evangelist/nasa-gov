openapi: 3.2.0
info:
  title: NASA SSD/CNEOS Sentry API
  description: 'Solar System Dynamics (SSD) and Center for Near-Earth Object Studies (CNEOS) APIs at JPL. Provides

    authoritative orbital, physical, and risk data for small bodies including close approach data, small

    body database lookup and query, Sentry impact risk, Fireball atmospheric events, NHATS human-accessible

    targets, mission design, and scout.

    '
  version: '1.0'
  contact:
    name: JPL Solar System Dynamics
    url: https://ssd-api.jpl.nasa.gov/
  license:
    name: US Government Work (Public Domain)
servers:
- url: https://ssd-api.jpl.nasa.gov
tags:
- name: Sentry
paths:
  /sentry.api:
    get:
      summary: Sentry Impact Risk
      operationId: sentry
      tags:
      - Sentry
      parameters:
      - name: spk
        in: query
        schema:
          type: string
      - name: des
        in: query
        schema:
          type: string
      - name: h-max
        in: query
        schema:
          type: number
      - name: ps-min
        in: query
        schema:
          type: number
      - name: ip-min
        in: query
        schema:
          type: number
      - name: removed
        in: query
        schema:
          type: boolean
      - name: all
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Sentry impact risk table.
